name: Detect & Push

# 双层调度：
#   - 每小时（UTC 整点 :00）跑 快检+资源站（fast+normal+resource），资源站单独降到每小时一轮
#   - 每 30 分钟（UTC :15 / :45）跑 全量非资源站（fast+normal+slow），与整点快检错开
# 检测到版本/大小/日期变化时立即 embed + commit + push 到 main；
# main 的推送会直接触发站点（Pages）重新构建部署，即「改完即上线」。
on:
  schedule:
    - cron: '0 * * * *'      # 每小时整点：快检 + 资源站
    - cron: '15,45 * * * *'  # 每 30 分钟：全量（不含资源站）
  workflow_dispatch:
    inputs:
      mode:
        description: '检测模式：hourly=快检+资源站 / full=全量非资源站'
        required: false
        default: 'hourly'
        type: choice
        options: [hourly, full]

# 同一时刻只跑一个任务（并发组自动排队）
concurrency:
  group: main-push
  cancel-in-progress: false

jobs:
  detect-hourly:
    if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'hourly')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: sudo apt-get install -y -qq unrar || sudo apt-get install -y -qq unar
      - run: pip install -q py7zr
      - name: Hourly fast+normal+resource detect
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          output=$(python check_versions.py --priority fast,normal,resource --parallel 8 2>&1 | tee /tmp/detect.log) || rc=$?
          echo "$output"
          echo "changed=$(echo "$output" | grep -q 'CHANGED=true' && echo true || echo false)" >> $GITHUB_OUTPUT
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：本轮结果比线上少，data.json 未改写，请检查 PRODUCTS 配置"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::检测脚本异常退出（rc=$rc），data.json 未改写"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-log-hourly
          path: /tmp/detect.log
          retention-days: 3
      - name: Embed & push (有变化)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rc=0
          python embed_data.py || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：index.html 未改写，线上产品数保持原样"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::embed_data.py 异常退出（rc=$rc）"
            exit 1
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "detect(hourly): $(grep '🔄 版本变化' /tmp/detect.log | sed 's/🔄 版本变化: //')"
          git push origin HEAD:main
      - name: Refresh caches only (无变化)
        if: steps.detect.outputs.changed != 'true'
        run: |
          set -euo pipefail
          rc=0
          python embed_data.py || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：index.html 未改写，线上产品数保持原样"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::embed_data.py 异常退出（rc=$rc）"
            exit 1
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add md5_cache.json pe_version_cache.json startallback_dll_cache.json data.json
          git diff --staged --quiet && { echo "无变化，跳过"; exit 0; }
          git commit -m "chore: refresh probe caches"
          git push origin HEAD:main

  detect-full:
    if: github.event.schedule == '15,45 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: sudo apt-get install -y -qq unrar || sudo apt-get install -y -qq unar
      - run: pip install -q py7zr
      - name: Full detect (non-resource)
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          output=$(python check_versions.py --priority fast,normal,slow --parallel 8 2>&1 | tee /tmp/detect.log) || rc=$?
          echo "$output"
          echo "changed=$(echo "$output" | grep -q 'CHANGED=true' && echo true || echo false)" >> $GITHUB_OUTPUT
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：本轮结果比线上少，data.json 未改写，请检查 PRODUCTS 配置"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::检测脚本异常退出（rc=$rc），data.json 未改写"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-log-full
          path: /tmp/detect.log
          retention-days: 7
      - name: Embed & push (有变化)
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rc=0
          python embed_data.py || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：index.html 未改写，线上产品数保持原样"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::embed_data.py 异常退出（rc=$rc）"
            exit 1
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "detect(full): $(grep '🔄 版本变化' /tmp/detect.log | sed 's/🔄 版本变化: //')"
          git push origin HEAD:main
      - name: Refresh caches only (无变化)
        if: steps.detect.outputs.changed != 'true'
        run: |
          set -euo pipefail
          rc=0
          python embed_data.py || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error::产品数量守卫拦截：index.html 未改写，线上产品数保持原样"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::embed_data.py 异常退出（rc=$rc）"
            exit 1
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add md5_cache.json pe_version_cache.json startallback_dll_cache.json data.json
          git diff --staged --quiet && { echo "无变化，跳过"; exit 0; }
          git commit -m "chore: refresh probe caches"
          git push origin HEAD:main