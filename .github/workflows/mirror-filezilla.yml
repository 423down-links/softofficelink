name: Mirror FileZilla Pro

# 一次性任务：把 FileZilla Pro 官方原版包镜像到 Release（跑完即删）
on:
  push:
    paths:
      - '.github/workflows/mirror-filezilla.yml'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Mirror to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/mirror_release.py --only "FileZilla Pro"
