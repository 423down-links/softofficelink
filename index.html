let data = EMBEDDED_DATA;

function formatDate(dateStr) {
  if (!dateStr) return '-';
  // 处理非标准时区如 Asia/Shanghai
  let s = dateStr.replace(/Asia\/Shanghai|CST|China Standard Time/gi, 'GMT+8');
  s = s.replace(/Asia\/.+/gi, 'GMT+8');
  let y, m, d;
  // 尝试解析为Date对象
  try {
    const dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      y = dt.getFullYear();
      m = dt.getMonth() + 1;
      d = dt.getDate();
      return `${y}/${m}/${d}`;
    }
  } catch(e) {}
  // 提取日期部分 YYYY-MM-DD 或 YYYY/M/D
  const match = dateStr.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (match) {
    return `${parseInt(match[1])}/${parseInt(match[2])}/${parseInt(match[3])}`;
  }
  // 英文月份格式 Sep 03, 2026
  const m2 = dateStr.match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(20\d{2})/);
  if (m2) {
    const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const mon = months[m2[1].toLowerCase().slice(0,3)] || 1;
    return `${parseInt(m2[3])}/${mon}/${parseInt(m2[2])}`;
  }
  return dateStr.slice(0, 16);
}

function compareVersion(v1, v2) {
  // 提取版本号中的数字部分，支持 "21.8 SR-6"、"4.1.15.9"、"8.0.0110" 等格式
  const extract = (v) => {
    const nums = String(v).match(/\d+/g);
    return nums ? nums.map(n => parseInt(n, 10)) : [];
  };
  const a = extract(v1);
  const b = extract(v2);
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const x = a[i] || 0;
    const y = b[i] || 0;
    if (x !== y) return x - y;
  }
  return 0;
}

function render() {
  const content = document.getElementById('content');
  let html = '';

  // 按更新日期降序排序，最新的在最上方
  const sorted = [...data.products].sort((a, b) => {
    const da = a.last_modified ? new Date(a.last_modified).getTime() : 0;
    const db = b.last_modified ? new Date(b.last_modified).getTime() : 0;
    return db - da;
  });

  html += '<table><thead><tr>';
  html += '<th class="col-software">软件</th>';
  html += '<th class="col-version">最新版本</th>';
  html += '<th class="col-size">大小</th>';
  html += '<th class="col-date">发布日期</th>';
  html += '<th class="col-download">下载</th>';
  html += '</tr></thead><tbody>';

  sorted.forEach(p => {
    const dateStr = formatDate(p.last_modified);
    const dlUrl = p.download_url_with_params || p.download_url;
    const siteLink = p.official_site ? '<a href="' + p.official_site + '" class="site-link" target="_blank">' + p.official_site.replace('https://','').replace('/','') + '</a>' : '';
    const sizeStr = p.size_mb ? p.size_mb + ' MB' : '-';

    html += '<tr>';
    html += '<td class="col-software" data-label="软件"><span class="product-name">' + p.name_cn + '</span><span class="product-name-en">' + p.name + '</span><br>' + siteLink + '</td>';
    html += '<td class="col-version" data-label="版本"><span class="version">v' + p.version + '</span></td>';
    html += '<td class="col-size size" data-label="大小">' + sizeStr + '</td>';
    html += '<td class="col-date date" data-label="日期">' + dateStr + '</td>';
    html += '<td class="col-download" data-label="下载"><a href="' + dlUrl + '" class="direct-link" target="_blank">' + dlUrl + '</a></td>';
    html += '</tr>';
  });

  html += '</tbody></table>';

  content.innerHTML = html;
  document.getElementById('lastUpdated').textContent = new Date(data.updated_at).toLocaleString('zh-CN');
}

async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      data = await resp.json();
    }
  } catch (e) {}
  render();
}
