function formatDate(dateStr) {
  if (!dateStr) return '-';
  // 支持多种分隔符：- / . 
  const match = dateStr.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (match) {
    return parseInt(match[1]) + '/' + parseInt(match[2]) + '/' + parseInt(match[3]);
  }
  // 英文月份格式 Sep 03, 2026
  const m2 = dateStr.match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(20\d{2})/);
  if (m2) {
    const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const mon = months[m2[1].toLowerCase().slice(0,3)] || 1;
    return parseInt(m2[3]) + '/' + mon + '/' + parseInt(m2[2]);
  }
  // 尝试解析为Date对象（处理带时区的完整日期）
  try {
    let s = dateStr.replace(/Asia\/Shanghai|CST|China Standard Time/gi, 'GMT+8');
    const dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      // 转换为北京时间显示
      const beijingOffset = 8 * 60 * 60 * 1000;
      const bj = new Date(dt.getTime() + beijingOffset);
      return bj.getUTCFullYear() + '/' + (bj.getUTCMonth()+1) + '/' + bj.getUTCDate();
    }
  } catch(e) {}
  return dateStr.slice(0, 16);
}

function formatDetected(str) {

}

function compareVersion(v1, v2) {
  // 提取版本号中的数字部分，支持 "21.8 SR-6"、"4.1.15.9"、"8.0.0110" 等格式
  const extract = (v) => {
    const nums = String(v).match(/\d+/g);
    return nums ? nums.map(n => parseInt(n, 10)) : [];
  };
  const a = extract(v1);
  const b = extract(v2);
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const x = a[i] || 0;
    const y = b[i] || 0;
    if (x !== y) return x - y;
  }
  return 0;
}

function isToday(dateStr) {
  if (!dateStr) return false;

  const now = new Date();
  const beijingOffset = 8 * 60 * 60 * 1000;
  const beijingNow = new Date(now.getTime() + beijingOffset);
  const todayStr = beijingNow.getUTCFullYear() + '-' + 
                   String(beijingNow.getUTCMonth()+1).padStart(2,'0') + '-' + 
                   String(beijingNow.getUTCDate()).padStart(2,'0');
  // 支持多种分隔符：- / . 以及英文月份格式
  let m = dateStr.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) {
    const dateStrNorm = m[1] + '-' + String(parseInt(m[2])).padStart(2,'0') + '-' + String(parseInt(m[3])).padStart(2,'0');
    return dateStrNorm === todayStr;
  }
  // 英文月份格式 Sep 03, 2026
  const m2 = dateStr.match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(20\d{2})/);
  if (m2) {
    const months = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
    const mon = months[m2[1].toLowerCase().slice(0,3)] || '01';
    const dateStrNorm = m2[3] + '-' + mon + '-' + String(parseInt(m2[2])).padStart(2,'0');
    return dateStrNorm === todayStr;
  }
  return false;
}

function parseDateParts(dateStr) {

  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
  const m2 = dateStr.match(/([A-Za-z]+)\s+(\d{1,2}),?\s*(20\d{2})/);
  if (m2) {
    const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    return { y: parseInt(m2[3]), m: months[m2[1].toLowerCase().slice(0,3)] || 1, d: parseInt(m2[2]) };
  }
  return null;
}
function beijingTodayParts() {
  const beijingOffset = 8 * 60 * 60 * 1000;

  return { y: bj.getUTCFullYear(), m: bj.getUTCMonth() + 1, d: bj.getUTCDate() };

function daysSince(dateStr) {
  const parts = parseDateParts(dateStr);

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'

}

// 写入 HTML 属性用：转义特殊字符，并把换行编码为 &#10;（读取时浏览器会自动还原）
function attrEncode(str) {
  return escapeHtml(str).replace(/\r\n|\r|\n/g, '&#10;');
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

    }

    html += '<tr>';
    html += '<td class="col-software" data-label="软件"><span class="product-name">' + escapeHtml(p.name_cn) + '</span><span class="product-name-en">' + escapeHtml(p.name) + '</span><br>' + siteLink + '</td>';
    html += hasArticles
      ? versionHtml
      : '<td class="col-version' + (hasVariants ? ' col-version-multi' : '') + '" data-label="版本">' + versionHtml + '</td>';
    html += sizeHtml;
    const dateClass = isToday(p.last_modified) ? 'col-date date date-today' : 'col-date date';
    html += '<td class="' + dateClass + '" data-label="发布时间">' + dateStr + '</td>';
    html += '<td class="col-check" data-label="检测时间">' + formatDetected(p.detected_at) + '</td>';
    // 多平台二级下载（如 VC++ 运行库 x64/x86/arm64）：渲染平台按钮，
    // 左键直接下载，右键/长按弹菜单复制完整地址；普通软件走原直链+复制钮。
    const dlArr = Array.isArray(p.downloads) ? p.downloads : [];
    let downloadHtml;
    if (dlArr.length) {
      downloadHtml = '<div class="dl-platforms">' + dlArr.map(d => {
        const nm = escapeHtml(d.name || '');
        const url = escapeHtml(d.url || '');
        return '<a href="' + url + '" class="dl-platform" data-name="' + nm + '" data-url="' + url + '" target="_blank" rel="nofollow noopener">' + nm + '</a>';
      }).join('') + '</div>';
    } else {
      downloadHtml = '<div class="dl-wrap"><a href="' + dlUrl + '" class="direct-link" target="_blank" rel="nofollow noopener">' + dlUrl + '</a><button class="copy-name-btn" type="button" data-copy-text="' + attrEncode(copyPayload) + '" title="复制软件信息" aria-label="复制软件信息">' + COPY_ICON + '</button></div>';
    }
    html += '<td class="col-download" data-label="下载">' + downloadHtml + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

function sortProducts(arr) {
  // 排序优先级：① 今日更新 → ② last_modified 降序
  return [...arr].sort((a, b) => {
    const aToday = isToday(a.last_modified) ? 1 : 0;
    const bToday = isToday(b.last_modified) ? 1 : 0;
    if (aToday !== bToday) return bToday - aToday;
    const da = a.last_modified ? new Date(a.last_modified).getTime() : 0;
    const db = b.last_modified ? new Date(b.last_modified).getTime() : 0;
    return db - da;
  });
}

function render() {
  const content = document.getElementById('content');
  const countEl = document.getElementById('searchCount');
  const kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  if (kw) {
    // 搜索模式：匹配全部软件（中/英文名 + 别名），不按时间折叠
    const matched = sortProducts(data.products).filter(p =>
      (p.name_cn || '').toLowerCase().includes(kw) ||
      (p.name || '').toLowerCase().includes(kw) ||
      (p.alias || '').toLowerCase().includes(kw)
    );
    countEl.textContent = matched.length ? '命中 ' + matched.length + ' 款' : '无匹配';
    content.innerHTML = matched.length
      ? renderTable(matched)
      : '<div class="no-result">未找到包含「' + escapeHtml(kw) + '」的软件</div>';
  } else {
    countEl.textContent = '';
    const recent = sortProducts(data.products.filter(p => isRecent(p.last_modified)));
    const older = sortProducts(data.products.filter(p => !isRecent(p.last_modified)));
    let html = '';
    html += recent.length ? renderTable(recent) : '<div class="no-result">暂无近期更新</div>';
    if (older.length) {
      html += '<details class="older-group">'
        + '<summary><span>更早更新（' + older.length + ' 款）</span><span class="older-hint">点击展开</span></summary>'
        + renderTable(older)
        + '</details>';
    }
    content.innerHTML = html;
  }

  document.getElementById('lastUpdated').textContent = new Date(data.updated_at).toLocaleString('zh-CN');
}

async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      data = await resp.json();
    }
  } catch (e) {}
  render();
}

document.getElementById('searchInput').addEventListener('input', render);

loadData();
</script>
